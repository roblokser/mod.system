plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.1'
    id 'maven-publish'
}
version = '1.0.0'
group = 'com.systemclient'
base { archivesName = 'SystemClient' }

repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
